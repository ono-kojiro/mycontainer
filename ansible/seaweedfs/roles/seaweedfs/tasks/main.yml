---
- name: upload deb package
  ansible.builtin.copy:
    src: "{{ debfile }}"
    dest: /tmp/

- name: install deb package
  ansible.builtin.apt:
    deb: "/tmp/{{ debfile }}"
    state: present

- name: systemctl daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: systemctl restart
  ansible.builtin.systemd_service:
    name: "seaweedfs-{{ item }}"
    state: restarted
  with_items: "{{ components }}"

